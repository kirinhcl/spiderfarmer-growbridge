[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderfarmer-growbridge"
version = "0.1.0"
description = "Local Spider Farmer GGS BLE control, telemetry history, and MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["bleak>=1.1,<4; sys_platform == 'linux'", "fastapi>=0.115,<1", "httpx>=0.27,<1", "mcp>=1.26,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
growbridge = "growbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
growbridge = ["native/*.swift"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
